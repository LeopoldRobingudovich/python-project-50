line-length = 80

[lint]
preview = true
select = ["E", "F", "I", "C90", "UP", "B", "S", "FURB", "RUF"]
ignore = ["Q"]

[lint.per-file-ignores]
# В init-модулях допустимы неиспользуемые импорты
"__init__.py" = ["unused-import"]
# assert в тестах это норма pytest
"tests/**" = ["assert"]

# Блок, отвечающий за кавычки
[format]
quote-style = "preserve"
